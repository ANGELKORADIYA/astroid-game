<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Game | Pilot your ship and survive the space storm!</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="An exciting and challenging Asteroid arcade game. Pilot your ship, destroy incoming asteroids, and survive the space storm! Built by Angel Koradiya.">
    <meta name="keywords" content="asteroid game, space shooter, arcade, web game, angelgames, asteroid-game, javascript game, space arcade, Angel Koradiya">
    <meta name="author" content="Angel Koradiya">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://angelkoradiya.github.io/astroid-game/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://angelkoradiya.github.io/astroid-game/">
    <meta property="og:title" content="Asteroid Game | Action-Packed Space Shooter">
    <meta property="og:description" content="Pilot your ship, destroy asteroids, and beat your high score in this modern arcade experience.">
    <meta property="og:image" content="https://angelkoradiya.github.io/astroid-game/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://angelkoradiya.github.io/astroid-game/">
    <meta property="twitter:title" content="Asteroid Game | Action-Packed Space Shooter">
    <meta property="twitter:description" content="Pilot your ship, destroy asteroids, and beat your high score in this modern arcade experience.">
    <meta property="twitter:image" content="https://angelkoradiya.github.io/astroid-game/og-image.jpg">

    <meta name="theme-color" content="#4ecdc4">

    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Floating HUD -->
    <div class="hud">
        <div class="hud-top">
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">High Score</span>
                    <span class="stat-value" id="highScore">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="time">00:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Level</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Mode</span>
                    <span class="stat-value" id="modeDisplay">Normal</span>
                </div>
            </div>
            <div class="powerup-status" id="powerupStatus">
                <!-- Power-ups will appear here -->
            </div>
            <div class="hud-buttons">
                <button id="settingsBtn" class="icon-btn">⚙️</button>
                <button id="pauseBtn" class="icon-btn">⏸️</button>
                <button id="restartBtn" class="icon-btn">🔄</button>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="controls-hint">
                <span>↑↓←→ or WASD Move</span>
                <span>Space Shoot</span>
                <span>P Pause</span>
                <span>M Music</span>
            </div>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOver" class="game-over hidden">
        <div class="game-over-content">
            <h2>💥 Game Over!</h2>
            <div class="final-stats">
                <div class="final-stat">
                    <span class="final-label">Final Score</span>
                    <span class="final-value" id="finalScore">0</span>
                </div>
                <div class="final-stat new-high-score hidden" id="newHighScoreSection">
                    <span class="final-label">🏆 NEW HIGH SCORE! 🏆</span>
                    <span class="final-value" id="newHighScore">0</span>
                </div>
                <div class="final-stat">
                    <span class="final-label">Best Score</span>
                    <span class="final-value" id="bestScore">0</span>
                </div>
                <div class="final-stat">
                    <span class="final-label">Time Survived</span>
                    <span class="final-value" id="finalTime">00:00</span>
                </div>
                <div class="final-stat">
                    <span class="final-label">Level Reached</span>
                    <span class="final-value" id="finalLevel">1</span>
                </div>
                <div class="final-stat">
                    <span class="final-label">Difficulty</span>
                    <span class="final-value" id="finalMode">Normal</span>
                </div>
            </div>
            <div class="game-over-buttons">
                <button id="playAgainBtn" class="action-btn">🎮 Play Again</button>
            </div>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settingsPanel" class="settings-panel hidden">
        <div class="settings-content">
            <h3>⚙️ Settings</h3>
            <div class="setting-item">
                <label>Sound Effects</label>
                <input type="checkbox" id="soundToggle" checked>
            </div>
            <div class="setting-item">
                <label>Background Music</label>
                <input type="checkbox" id="musicToggle" checked>
            </div>
            <div class="setting-item">
                <label>Music Volume</label>
                <input type="range" id="musicVolume" min="0" max="100" value="50">
            </div>
            <div class="setting-item">
                <label>Difficulty</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Particles</label>
                <input type="checkbox" id="particlesToggle" checked>
            </div>
            <div class="setting-item">
                <label>Show FPS</label>
                <input type="checkbox" id="fpsToggle">
            </div>
            <div class="setting-item">
                <label>Ship Color</label>
                <select id="shipColor">
                    <option value="#4ecdc4">Cyan</option>
                    <option value="#ff6b6b">Red</option>
                    <option value="#95e77e">Green</option>
                    <option value="#ffd93d">Yellow</option>
                </select>
            </div>
            <button id="closeSettings" class="action-btn">✖️ Close</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
